# Phase-1 live-validation config.
# Lean + cheap (use with `--testing` for open-weight models), isolated data dir,
# with all Phase-1 correctness-kernel flags ENABLED to exercise them end-to-end.

providers:
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    default_model: claude-sonnet-4-5-20250929
  together:
    type: openai_compatible
    api_key_env: TOGETHER_API_KEY
    base_url: https://api.together.xyz/v1
    default_model: meta-llama/Llama-3.3-70B-Instruct-Turbo
  google:
    type: openai_compatible
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    default_model: gemini-3-pro-preview

agent:
  default_model: "meta-llama/Llama-3.3-70B-Instruct-Turbo"
  opus_model: "claude-opus-4-6"
  max_tokens: 8192
  temperature: 1.0
  token_budget_per_thread: 1000000
  token_budget_per_agent: 100000
  default_provider: together
  overrides:
    theorist:
      provider: anthropic
      model: claude-opus-4-6
    writer:
      provider: anthropic
      model: claude-opus-4-6
      max_tokens: 16384

# Cheap open-weight models, applied with `--testing`.
testing_overrides:
  theorist:
    provider: together
    model: deepseek-ai/DeepSeek-V4-Pro
  experimentalist:
    provider: together
    model: deepseek-ai/DeepSeek-V4-Pro
  analyst:
    provider: together
    model: moonshotai/Kimi-K2.6
  synthesizer:
    provider: together
    model: moonshotai/Kimi-K2.6
  writer:
    provider: together
    model: zai-org/GLM-5.1
  skeptic:
    provider: together
    model: zai-org/GLM-5.1
  editor:
    provider: together
    model: moonshotai/Kimi-K2.6

# Verification re-executes in a fresh --network=none sandbox.
sandbox:
  enabled: true
  image_name: "paradigm-sandbox:latest"
  network_mode: "none"
  cpu_limit: 2.0
  memory_limit: "2g"
  execution_timeout: 120
  max_output_size: 10485760

literature:
  arxiv_rate_limit: 3.0
  max_results_per_search: 20
  enable_pdf_fetch: true
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  follow_budget_per_round: 1
  cited_by_budget_per_round: 1
  read_budget_per_round: 2
  max_read_chars: 6000
  max_citation_results: 5
  max_reference_results: 10

# Isolated data dir so validation never pollutes the real corpus/DB.
storage:
  data_dir: "./data_validate"

orchestrator:
  enable_prompt_preprocessing: false  # deterministic test runs
  max_rounds_per_phase: 2
  enable_checkpointing: true
  checkpoint_interval: 5
  enable_writing: true
  max_review_iterations: 2
  enable_peer_review: true
  num_reviewers: 2
  max_revision_rounds: 1
  enable_experimentation: true
  max_searches_per_round: 2
  enable_debates: false
  enable_execution_sprints: false
  num_execution_sprints: 1
  # --- Phase 1 flags ---
  enable_verification: true
  verification_tolerance: 1.0e-6
  verification_seed: 12345
  verification_reexec_budget: 5
  abort_on_verification_failure: true
  enable_best_first_nodes: true
  enable_step_restart: true
  debug_buggy_node_prob: 0.3
  human_gate_mode: "advisory"
  human_gate_points:
    - problem_selection
    - pre_registration
    - final_verification

skills:
  skills_dir: "vendor/claude-scientific-skills/scientific-skills"
  default_mode: "default"
  max_skill_chars: null

# Lean: skip episodic memory to reduce moving parts during validation.
memory:
  enabled: false
  max_memories_per_prompt: 5
  recency_half_life_days: 30.0
  collection_name: "agent_memories"
  max_memory_chars: 2000

knowledge:
  enable_world_model: true
  world_model_max_context_chars: 3000
  enable_evidence_graph: false
  enable_hypothesis_tournament: true
  tournament_population_size: 4
  tournament_winners: 2
  tournament_k_factor: 32.0
  # --- Phase 1A flags ---
  enable_preregistration: true
  prereg_require_refutation: true
  prereg_on_empty: "advisory"

# Skip citation grounding / seed discovery to keep the run fast and cheap.
citation:
  enable_citation_grounding: false
  enable_novelty_check: false
  enable_seed_discovery: false
