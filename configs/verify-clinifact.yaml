# Production-lineup VERIFICATION config (prompt 173, task 2). The real diverse
# team (top OpenAI/Anthropic/Gemini) with experiments + citation grounding +
# LaTeX/PDF all on — to validate the strong-model publish path and inspect a
# high-quality PDF after the quality fixes. MCP (alphaXiv OAuth) and the
# hypothesis tournament are off to bound cost/time for a one-off verification.
#   PARADIGM_CONFIG=configs/verify-production.yaml PARADIGM_DATA_DIR=/tmp/verify_prod \
#     conda run -n paradigm python -m paradigm.main run --mode directed --prompt "..."

providers:
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    default_model: claude-haiku-4-5
  gemini:
    type: openai_compatible
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    default_model: gemini-2.5-flash
  openai:
    type: openai_compatible
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
    default_model: gpt-4.1-mini

agent:
  default_model: "gemini-2.5-flash-lite"
  opus_model: "claude-haiku-4-5"
  max_tokens: 8192
  temperature: 1.0
  token_budget_per_thread: 1000000
  token_budget_per_agent: 100000
  default_provider: gemini
  overrides:
    theorist: { provider: openai, model: gpt-5.4, max_tokens: 12288 }
    analyst: { provider: anthropic, model: claude-sonnet-4-6 }
    skeptic: { provider: anthropic, model: claude-sonnet-4-6 }
    experimentalist: { provider: anthropic, model: claude-sonnet-4-6, max_tokens: 16384 }
    writer: { provider: anthropic, model: claude-opus-4-8, max_tokens: 16384 }
    synthesizer: { provider: gemini, model: gemini-2.5-flash }
    editor: { provider: gemini, model: gemini-2.5-flash }
    reviewer: { provider: gemini, model: gemini-2.5-flash }

sandbox:
  enabled: true
  # Transformer-enabled image (built from docker/Dockerfile.sandbox-ml): ships a
  # CPU torch + transformers stack with BioBERT pre-cached, so the model loads
  # offline and network can stay disabled.
  image_name: "paradigm-sandbox-ml:latest"
  network_mode: "none"
  # Raised caps for CPU transformer work. ADJUST to your VM: cpu_limit must be
  # <= the VM's vCPUs and memory_limit <= its RAM. Fine-tuning BERT-base needs
  # ~4-6 GB; frozen-embedding inference needs less. The 60-min execution_timeout
  # gives CPU fine-tuning room (the lean default is 300s).
  cpu_limit: 6.0
  memory_limit: "10g"
  execution_timeout: 3600
  pids_limit: 1024
  max_output_size: 10485760

literature:
  arxiv_rate_limit: 3.0
  max_results_per_search: 30
  enable_pdf_fetch: true
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  follow_budget_per_round: 1
  cited_by_budget_per_round: 1
  read_budget_per_round: 3
  max_read_chars: 8000
  max_citation_results: 10
  max_reference_results: 20
  mcp:
    enabled: false

storage:
  data_dir: "./data"

display:
  stream_tokens: false

orchestrator:
  enable_prompt_preprocessing: false  # deterministic test runs
  max_rounds_per_phase: 1
  enable_checkpointing: true
  checkpoint_interval: 5
  enable_writing: true
  max_review_iterations: 2
  enable_peer_review: true
  num_reviewers: 1
  max_revision_rounds: 1
  enable_experimentation: true
  model_preflight: true
  max_searches_per_round: 3
  enable_debates: false
  enable_execution_sprints: false
  enable_verification: false
  human_gate_mode: "off"

skills:
  skills_dir: "vendor/claude-scientific-skills/scientific-skills"
  default_mode: "default"
  max_skill_chars: null

memory:
  enabled: true
  collection_name: "agent_memories"

knowledge:
  enable_world_model: true
  enable_evidence_graph: true
  enable_hypothesis_tournament: false
  enable_preregistration: false

journal:
  enable_latex_output: true
  latex_journal: "arxiv"
  compile_pdf: true

citation:
  enable_citation_grounding: true
  enable_novelty_check: false
  enable_seed_discovery: false
