# Paradigm Default Configuration
# API key is loaded from .env file (ANTHROPIC_API_KEY)

# Agent configuration
agent:
  default_model: "claude-sonnet-4-5-20250929"
  opus_model: "claude-opus-4-6-20250514"
  max_tokens: 4096
  temperature: 1.0
  token_budget_per_thread: 1000000
  token_budget_per_agent: 100000
  
# Sandbox configuration
sandbox:
  enabled: true
  image_name: "paradigm-sandbox:latest"
  network_mode: "none"
  cpu_limit: 2.0
  memory_limit: "2g"
  execution_timeout: 300
  max_output_size: 10485760

# Literature search configuration
literature:
  arxiv_rate_limit: 3.0
  max_results_per_search: 200
  enable_pdf_fetch: true
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"

# Storage configuration
storage:
  data_dir: "./data"

# Orchestrator configuration
orchestrator:
  max_rounds_per_phase: 10
  enable_checkpointing: true
  checkpoint_interval: 5
  enable_writing: true
  max_review_iterations: 1
  enable_peer_review: true
  num_reviewers: 2
  max_revision_rounds: 2
  enable_experimentation: true
  max_experiment_rounds: 3
  max_searches_per_round: 3

# Scientific skills configuration
skills:
  skills_dir: "vendor/claude-scientific-skills/scientific-skills"
  default_mode: "default"
  max_skill_chars: null  # No truncation by default
