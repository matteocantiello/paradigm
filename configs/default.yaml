# Paradigm Default Configuration
# API key is loaded from .env file (ANTHROPIC_API_KEY)

# LLM provider registry
providers:
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    default_model: claude-sonnet-4-5-20250929
  together:
    type: openai_compatible
    api_key_env: TOGETHER_API_KEY
    base_url: https://api.together.xyz/v1
    default_model: meta-llama/Llama-3.3-70B-Instruct-Turbo
  google:
    type: openai_compatible
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    default_model: gemini-3-pro-preview

# Agent configuration
agent:
  default_model: "meta-llama/Llama-3.3-70B-Instruct-Turbo"
  opus_model: "claude-opus-4-6"
  max_tokens: 8192
  temperature: 1.0
  token_budget_per_thread: 1000000
  token_budget_per_agent: 100000
  default_provider: together
  overrides:
    theorist:
      provider: anthropic
      model: claude-opus-4-6
      token_budget_per_agent: 300000
    experimentalist:
      provider: anthropic
      model: claude-opus-4-6
      token_budget_per_agent: 300000
    analyst:
      provider: anthropic
      model: claude-opus-4-6
      token_budget_per_agent: 300000
    synthesizer:
      provider: anthropic
      model: claude-opus-4-6
      token_budget_per_agent: 300000
    writer:
      provider: anthropic
      model: claude-opus-4-6
      max_tokens: 16384
      token_budget_per_agent: 300000
    skeptic:
      provider: google
      model: gemini-3-pro-preview
    editor:
      provider: google
      model: gemini-3-pro-preview

# Testing mode overrides (applied when --testing flag is passed)
testing_overrides:
  theorist:
    provider: together
    model: deepseek-ai/DeepSeek-V4-Pro
  experimentalist:
    provider: together
    model: deepseek-ai/DeepSeek-V4-Pro
  analyst:
    provider: together
    model: moonshotai/Kimi-K2.6
  synthesizer:
    provider: together
    model: moonshotai/Kimi-K2.6
  writer:
    provider: together
    model: zai-org/GLM-5.1
  skeptic:
    provider: together
    model: zai-org/GLM-5.1
  editor:
    provider: together
    model: moonshotai/Kimi-K2.6

# Sandbox configuration
sandbox:
  enabled: true
  image_name: "paradigm-sandbox:latest"
  # SPEC hard constraint: agent-generated code runs network-isolated. "none"
  # also keeps the safety scanner's network-import guard active (executor.py).
  # Use the explicit --network-access CLI flag to opt in when truly needed.
  network_mode: "none"
  cpu_limit: 2.0
  memory_limit: "2g"
  execution_timeout: 300
  max_output_size: 10485760

# Literature search configuration
literature:
  arxiv_rate_limit: 3.0
  max_results_per_search: 50
  enable_pdf_fetch: true
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  follow_budget_per_round: 3
  cited_by_budget_per_round: 2
  read_budget_per_round: 5
  max_read_chars: 8000
  max_citation_results: 10
  max_reference_results: 20

# Storage configuration
storage:
  data_dir: "./data"

# Orchestrator configuration
orchestrator:
  max_rounds_per_phase: 10
  enable_checkpointing: true
  checkpoint_interval: 5
  enable_writing: true
  max_review_iterations: 5
  enable_peer_review: true
  num_reviewers: 2
  max_revision_rounds: 4
  enable_experimentation: true
  # max_experiment_rounds: null  # Default: 2 × max_rounds_per_phase
  max_searches_per_round: 5
  enable_debates: true
  max_debate_exchanges: 3
  max_debates_per_phase: 2
  enable_execution_sprints: true
  num_execution_sprints: 3
  sprint_review_roles:
    - theorist
    - analyst
    - skeptic
  # --- Correctness kernel (Phase 1) + output quality (Phase 2). All off by default. ---
  # Verification kernel (1B): re-execute results in a fresh sandbox; accept only
  # what reproduces its RESULT[label]=value tokens within tolerance.
  enable_verification: false
  verification_tolerance: 1.0e-6
  verification_seed: 12345
  verification_reexec_budget: 20
  abort_on_verification_failure: true
  # Tree-search / step-restart (1C)
  enable_best_first_nodes: false
  enable_step_restart: false
  debug_buggy_node_prob: 0.3
  max_step_restarts_per_experiment: 2
  # Hybrid human-gate (1E): off | advisory | blocking (autonomous by default)
  human_gate_mode: "off"
  human_gate_points:
    - problem_selection
    - pre_registration
    - final_verification
  # Figure-aware multimodal review (Phase 2 P2-VLM)
  enable_multimodal_review: false
  multimodal_review_role: "editor"
  max_review_figures: 6

# Scientific skills configuration
skills:
  skills_dir: "vendor/claude-scientific-skills/scientific-skills"
  default_mode: "default"
  max_skill_chars: null  # No truncation by default

# Agent episodic memory
memory:
  enabled: true
  max_memories_per_prompt: 5
  recency_half_life_days: 30.0
  collection_name: "agent_memories"
  max_memory_chars: 2000

# Knowledge architecture (world model, evidence graph, tournaments)
knowledge:
  enable_world_model: true
  world_model_max_context_chars: 3000
  enable_evidence_graph: true
  enable_hypothesis_tournament: true
  tournament_population_size: 8
  tournament_winners: 2
  tournament_k_factor: 32.0
  # Pre-registration / falsifiability (Phase 1A). Off by default.
  enable_preregistration: false
  prereg_require_refutation: true
  prereg_on_empty: "advisory"  # advisory | blocking

# Paper output formats (Phase 2). Markdown is always written; these are extra.
journal:
  enable_latex_output: false   # also write a journal-ready .tex
  latex_journal: "none"        # none | arxiv | neurips
  compile_pdf: false           # also compile the .tex to PDF (needs a LaTeX engine)

# Citation grounding and novelty checking
citation:
  enable_citation_grounding: true
  perplexity_api_key_env: "PERPLEXITY_API_KEY"
  citation_sections:
    - "introduction"
    - "methods"
  max_retries_per_paragraph: 2
  perplexity_timeout: 120.0
  enable_novelty_check: false
  novelty_mode: "semantic_scholar"
  futurehouse_api_key_env: "FUTURE_HOUSE_API_KEY"
  novelty_max_iterations: 5
  enable_seed_discovery: true
  seed_discovery_max_papers: 10
  drop_unresolved_citations: false  # drop refs that don't resolve (vs. bare URLs)
