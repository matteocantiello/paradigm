# Paradigm Default Configuration
# API key is loaded from .env file (ANTHROPIC_API_KEY)

# LLM provider registry
providers:
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    default_model: claude-sonnet-4-5-20250929
  together:
    type: openai_compatible
    api_key_env: TOGETHER_API_KEY
    base_url: https://api.together.xyz/v1
    default_model: meta-llama/Llama-3.3-70B-Instruct-Turbo
  google:
    type: openai_compatible
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    default_model: gemini-3-pro-preview

# Agent configuration
agent:
  default_model: "meta-llama/Llama-3.3-70B-Instruct-Turbo"
  opus_model: "claude-opus-4-6"
  max_tokens: 8192
  temperature: 1.0
  token_budget_per_thread: 1000000
  token_budget_per_agent: 100000
  default_provider: together
  overrides:
    theorist:
      provider: anthropic
      model: claude-opus-4-6
      token_budget_per_agent: 300000
    experimentalist:
      provider: anthropic
      model: claude-opus-4-6
      token_budget_per_agent: 300000
    analyst:
      provider: anthropic
      model: claude-opus-4-6
      token_budget_per_agent: 300000
    synthesizer:
      provider: anthropic
      model: claude-opus-4-6
      token_budget_per_agent: 300000
    writer:
      provider: anthropic
      model: claude-opus-4-6
      max_tokens: 16384
      token_budget_per_agent: 300000
    skeptic:
      provider: google
      model: gemini-3-pro-preview
    editor:
      provider: google
      model: gemini-3-pro-preview

# Testing mode overrides (applied when --testing flag is passed)
testing_overrides:
  theorist:
    provider: together
    model: Qwen/Qwen3.5-397B-A17B
  experimentalist:
    provider: together
    model: Qwen/Qwen3.5-397B-A17B
  analyst:
    provider: together
    model: deepseek-ai/DeepSeek-V3.1
  synthesizer:
    provider: together
    model: deepseek-ai/DeepSeek-V3.1
  writer:
    provider: together
    model: deepseek-ai/DeepSeek-V3.1
  skeptic:
    provider: together
    model: deepseek-ai/DeepSeek-V3.1
    extra_body:
      reasoning:
        enabled: true
  editor:
    provider: together
    model: deepseek-ai/DeepSeek-V3.1

# Sandbox configuration
sandbox:
  enabled: true
  image_name: "paradigm-sandbox:latest"
  network_mode: "none"
  cpu_limit: 2.0
  memory_limit: "2g"
  execution_timeout: 300
  max_output_size: 10485760

# Literature search configuration
literature:
  arxiv_rate_limit: 3.0
  max_results_per_search: 50
  enable_pdf_fetch: true
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  follow_budget_per_round: 3
  cited_by_budget_per_round: 2
  read_budget_per_round: 5
  max_read_chars: 8000
  max_citation_results: 10
  max_reference_results: 20

# Storage configuration
storage:
  data_dir: "./data"

# Orchestrator configuration
orchestrator:
  max_rounds_per_phase: 10
  enable_checkpointing: true
  checkpoint_interval: 5
  enable_writing: true
  max_review_iterations: 5
  enable_peer_review: true
  num_reviewers: 2
  max_revision_rounds: 4
  enable_experimentation: true
  # max_experiment_rounds: null  # Default: 2 × max_rounds_per_phase
  max_searches_per_round: 5
  enable_debates: true
  max_debate_exchanges: 3
  max_debates_per_phase: 2
  enable_execution_sprints: true
  num_execution_sprints: 3
  sprint_review_roles:
    - theorist
    - analyst
    - skeptic

# Scientific skills configuration
skills:
  skills_dir: "vendor/claude-scientific-skills/scientific-skills"
  default_mode: "default"
  max_skill_chars: null  # No truncation by default

# Agent episodic memory
memory:
  enabled: true
  max_memories_per_prompt: 5
  recency_half_life_days: 30.0
  collection_name: "agent_memories"
  max_memory_chars: 2000

# Knowledge architecture (world model, evidence graph, tournaments)
knowledge:
  enable_world_model: true
  world_model_max_context_chars: 3000
  enable_evidence_graph: false
  enable_hypothesis_tournament: false
  tournament_population_size: 8
  tournament_winners: 2
  tournament_k_factor: 32.0

# Citation grounding and novelty checking
citation:
  enable_citation_grounding: true
  perplexity_api_key_env: "PERPLEXITY_API_KEY"
  citation_sections:
    - "introduction"
    - "methods"
  max_retries_per_paragraph: 2
  perplexity_timeout: 120.0
  enable_novelty_check: false
  novelty_mode: "semantic_scholar"
  futurehouse_api_key_env: "FUTURE_HOUSE_API_KEY"
  novelty_max_iterations: 5
  enable_seed_discovery: true
  seed_discovery_max_papers: 10
