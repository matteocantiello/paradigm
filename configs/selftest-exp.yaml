# Paradigm SELF-TEST config — cheapest + fastest end-to-end smoke run.
#
# EXPERIMENTS-ON variant of the self-test config — exercises the Docker sandbox
# code-gen + execution path. Drives the LOCAL self-test loop (scripts/selftest.py): run a real research cycle
# end-to-end and triage the result, fast + cheap. All-Gemini Flash-Lite, 1 round
# per phase, experiments OFF (no Docker), lean peer review, no LaTeX/Perplexity.
# Exercises the full orchestration path: seeding → ideation → planning → writing →
# internal review → submission → peer review → publish/reject → topics → memory.
#
# Keys are loaded from .env (GEMINI_API_KEY). Use:
#   conda run -n paradigm python scripts/selftest.py

providers:
  gemini:
    type: openai_compatible
    api_key_env: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    default_model: gemini-2.5-flash-lite

agent:
  default_model: "gemini-2.5-flash-lite"
  opus_model: "gemini-2.5-flash"
  max_tokens: 8192
  temperature: 1.0
  token_budget_per_thread: 1000000
  token_budget_per_agent: 100000
  default_provider: gemini
  overrides:
    # The paper writer gets the slightly stronger Flash; everything else is the
    # cheapest Flash-Lite via the default.
    writer: { provider: gemini, model: gemini-2.5-flash, max_tokens: 12288 }

sandbox:
  enabled: true
  image_name: "paradigm-sandbox:latest"
  network_mode: "none"
  cpu_limit: 2.0
  memory_limit: "2g"
  execution_timeout: 300
  max_output_size: 10485760

literature:
  arxiv_rate_limit: 3.0
  max_results_per_search: 10
  enable_pdf_fetch: false
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  follow_budget_per_round: 0
  cited_by_budget_per_round: 0
  read_budget_per_round: 1
  max_read_chars: 4000
  max_citation_results: 5
  max_reference_results: 5

storage:
  data_dir: "./data"

display:
  stream_tokens: false

orchestrator:
  data_policy: "permissive"
  enable_prompt_preprocessing: false  # deterministic test runs
  max_rounds_per_phase: 1
  enable_checkpointing: true
  checkpoint_interval: 5
  enable_writing: true
  max_review_iterations: 1
  enable_peer_review: true
  num_reviewers: 1
  max_revision_rounds: 1
  enable_experimentation: true
  model_preflight: true
  max_searches_per_round: 2
  enable_debates: false
  enable_execution_sprints: false
  enable_verification: false
  human_gate_mode: "off"
  enable_multimodal_review: false

skills:
  skills_dir: "vendor/claude-scientific-skills/scientific-skills"
  default_mode: "default"
  max_skill_chars: null

memory:
  enabled: true
  collection_name: "agent_memories"

knowledge:
  enable_world_model: true
  enable_evidence_graph: true
  enable_hypothesis_tournament: false   # off: a tournament is many extra LLM calls
  enable_preregistration: false

journal:
  enable_latex_output: false
  latex_journal: "none"
  compile_pdf: false

citation:
  enable_citation_grounding: false
  enable_novelty_check: false
  enable_seed_discovery: false
