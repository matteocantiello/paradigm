<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Paradigm">
  <!-- Matches the app's Observatory logo: aperture rings + a central sun and a
       small cyan orbiting star, in the starlight-gold / live-data-cyan palette. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8c069" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#e8c069" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0e1322"/>
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>
  <circle cx="16" cy="16" r="11" fill="none" stroke="#e8c069" stroke-width="2" opacity="0.92"/>
  <circle cx="16" cy="16" r="7" fill="none" stroke="#e8c069" stroke-width="1.3" opacity="0.6"/>
  <circle cx="16" cy="16" r="2.7" fill="#e8c069"/>
  <circle cx="24" cy="8.4" r="1.8" fill="#5cd0dd"/>
</svg>
